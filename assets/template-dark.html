<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{TITLE}</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
body { font-family: 'Noto Sans SC', sans-serif; overflow-x: auto; padding: 40px 0; }
.font-serif { font-family: 'Noto Serif SC', serif; }

/* === 主题变量：深色科技风（默认）=== */
:root {
  --page-bg: #0B0D1A;
  --card-bg: linear-gradient(165deg, #131529 0%, #1A1B35 40%, #1E1440 100%);
  --card-border: rgba(124, 58, 237, 0.2);
  --accent-from: #7C3AED;
  --accent-to: #06B6D4;
  --text-primary: #FFFFFF;
  --text-secondary: #C4B5FD;
  --text-muted: #A78BFA;
  --module-bg: rgba(30, 20, 64, 0.8);
  --module-border: rgba(124, 58, 237, 0.2);
  --code-bg: #0F1123;
  --quote-bg: linear-gradient(to right, #1E1440, #0F1123);
}

.export-card {
  width: 1080px;
  height: 1440px;
  background: var(--card-bg);
  margin: 0 auto 40px auto;
  box-sizing: border-box;
  border: 1px solid var(--card-border);
  box-shadow: 0 0 60px rgba(124, 58, 237, 0.08), 0 10px 25px rgba(0,0,0,0.3);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  padding: 80px 70px 60px 70px;
  position: relative;
}
.tag-badge { display: inline-flex; align-items: center; justify-content: center; height: 32px; padding: 0 12px; line-height: 1; border: 1px solid var(--module-border); }
.tag-badge-main { border-color: transparent; }
.word-safe { overflow-wrap: break-word; word-break: normal; }
.accent-line { background: linear-gradient(90deg, var(--accent-from), var(--accent-to)); height: 1px; }
</style>
</head>
<body style="background-color: var(--page-bg);">
<div class="flex flex-col items-center">

<!-- === 卡片页开始 === -->
<div class="export-card text-white">

<!-- 顶部品牌区 -->
<div class="flex justify-between items-start mb-10 shrink-0">
  <div class="flex flex-col gap-4 w-full">
    <div class="flex items-center">
      <div class="bg-gradient-to-br from-[#7C3AED] to-[#06B6D4] text-white font-serif font-black text-2xl w-10 h-10 flex items-center justify-center mr-3 rounded">🦞</div>
      <div class="text-2xl font-serif font-black tracking-widest text-white">OpenClaw</div>
    </div>
    <div class="flex justify-between items-center mt-4">
      <div class="flex flex-wrap gap-2 text-sm font-mono font-medium">
        <span class="tag-badge tag-badge-main bg-gradient-to-r from-[#7C3AED] to-[#6D28D9] text-white">[主关键词]</span>
        <span class="tag-badge text-[#A78BFA]">[副关键词1]</span>
        <span class="tag-badge text-[#A78BFA]">[副关键词2]</span>
      </div>
      <div class="bg-gradient-to-r from-[#7C3AED] to-[#06B6D4] text-white px-4 py-2 text-sm font-bold tracking-wider">
        TLDR · [XX秒速览]
      </div>
    </div>
  </div>
</div>

<!-- 主内容区 -->
<div class="flex-grow flex flex-col mb-8 word-safe">
  <!-- 内容模块在此 -->
</div>

<!-- 底部落款 -->
<div class="mt-auto pt-6 border-t border-[#7C3AED]/20 flex justify-between items-center shrink-0">
  <div class="font-serif font-black text-xl text-transparent bg-clip-text bg-gradient-to-r from-[#A78BFA] to-[#22D3EE] tracking-widest">
    [01 / 02]
  </div>
  <div class="text-[15px] font-bold text-[#A78BFA]">
    · [品牌署名]
  </div>
</div>

</div>
<!-- === 卡片页结束 === -->

</div>
</body>
</html>
